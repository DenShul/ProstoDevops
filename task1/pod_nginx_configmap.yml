apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
spec:
  containers:
  - name: nginx-app
    image: nginx:1.21
    ports:
    - containerPort: 80

    volumeMounts:
    - name: nginx-volume
      mountPath: /usr/share/nginx/html

  volumes:
  - name: nginx-volume
    configMap:
      name: nginx-index
